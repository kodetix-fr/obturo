<!doctype html>
<html lang="en" class="pending">
<head>
  <meta charset="utf-8">
  <script src="theme-boot.js"></script> <!-- the theme of the settings on <html> before the first paint -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Obturo</title>
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="popup.js"></script>
</head>
<body>
  <!-- Icons: one sprite, used as <svg class="ic"><use href="#i-name"/></svg> (dom-i18n.js icon()). 24 px grid, 1.75 stroke.
       The history and sliders symbols are those of library.html. A "-edit" symbol is the same icon with a pencil badge. -->
  <svg class="sprite" aria-hidden="true" focusable="false">
    <symbol id="i-logo" viewBox="16 16 96 96">
      <clipPath id="logo-disc"><circle cx="64" cy="64" r="48"/></clipPath>
      <circle cx="64" cy="64" r="48" fill="#2563eb"/>
      <g clip-path="url(#logo-disc)" stroke="#bfdbfe" stroke-width="4.48" stroke-linecap="round" fill="none">
        <line x1="64" y1="42.4" x2="147.14" y2="90.4"/>
        <line x1="82.71" y1="53.2" x2="82.71" y2="149.2"/>
        <line x1="82.71" y1="74.8" x2="-0.43" y2="122.8"/>
        <line x1="64" y1="85.6" x2="-19.14" y2="37.6"/>
        <line x1="45.29" y1="74.8" x2="45.29" y2="-21.2"/>
        <line x1="45.29" y1="53.2" x2="128.43" y2="5.2"/>
      </g>
      <polygon points="64,42.4 82.71,53.2 82.71,74.8 64,85.6 45.29,74.8 45.29,53.2" fill="#ffffff"/>
    </symbol>
    <symbol id="i-area" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2.2" stroke-dasharray="3.2 2.6"/><path d="M12 8.8v6.4M8.8 12h6.4"/></symbol>
    <symbol id="i-visible" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12.5" rx="2.5"/><rect x="6.5" y="7.2" width="11" height="6.1" rx="1.2"/><path d="M9 20.2h6M12 16.5v3.7"/></symbol>
    <symbol id="i-full" viewBox="0 0 24 24"><rect x="5.5" y="2.8" width="13" height="18.4" rx="2.4"/><path d="M12 7.2v8.2M8.7 12.2l3.3 3.3 3.3-3.3"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24"><circle class="ring" cx="17.6" cy="17.6" r="6.6"/><circle class="disc" cx="17.6" cy="17.6" r="5.1"/><path class="nib" d="M15.7 19.5l.5-1.9 3-3 1.4 1.4-3 3zM18.2 15.9l1.4 1.4"/></symbol>
    <symbol id="i-area-edit" viewBox="0 0 24 24"><use href="#i-area"/><use href="#i-pencil"/></symbol>
    <symbol id="i-visible-edit" viewBox="0 0 24 24"><use href="#i-visible"/><use href="#i-pencil"/></symbol>
    <symbol id="i-full-edit" viewBox="0 0 24 24"><use href="#i-full"/><use href="#i-pencil"/></symbol>
    <symbol id="i-history" viewBox="0 0 24 24"><path d="M4.2 12a7.8 7.8 0 1 0 2.4-5.6M4.2 4.6v3.9h3.9M12 8v4.4l3 1.8"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h8M18 7h2M4 17h2M12 17h8"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></symbol>
    <!-- The two links under the menu: three tiles and a plus (the extensions page), a keyboard (their shortcuts). -->
    <symbol id="i-puzzle" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.8"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.8"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.8"/><path d="M17 13.6v6.8M13.6 17h6.8"/></symbol>
    <symbol id="i-notrace" viewBox="0 0 24 24"><path d="M3 12s3.2-6 9-6 9 6 9 6-3.2 6-9 6-9-6-9-6z"/><circle cx="12" cy="12" r="2.6"/><path d="M4 4l16 16"/></symbol>
    <symbol id="i-keyboard" viewBox="0 0 24 24"><rect x="2.8" y="6" width="18.4" height="12" rx="2.6"/><path d="M6.8 10h.01M10.3 10h.01M13.8 10h.01M17.3 10h.01M6.8 14h.01M17.3 14h.01M9.6 14h4.8"/></symbol>
  </svg>
  <header class="head">
    <svg class="logo" aria-hidden="true"><use href="#i-logo"/></svg>
    <span class="name">Obturo</span>
  </header>
  <div id="menu" role="menu"></div>
  <nav id="links" class="foot"></nav>
</body>
</html>

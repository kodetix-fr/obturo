<!doctype html>
<meta charset="utf-8">
<title>Obturo social preview</title>
<!-- Source of docs/social-preview.png, the 1280x640 card for the repository's social preview. Render it with Chromium
     at a 1280x640 viewport; it loads nothing from the network. -->
<style>
:root{--bg:#0e1118;--ink:#f4f6fa;--muted:#9aa3b2;--accent:#93c5fd}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1280px;height:640px}
body{background:var(--bg);font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;overflow:hidden;display:flex;align-items:center;padding:0 96px}
.mark{flex:none;margin-right:68px}
h1{font-weight:600;font-size:124px;line-height:1;letter-spacing:-.01em;color:var(--ink)}
.lead,.sub{font-size:34px;line-height:1.3;white-space:nowrap}
.lead{color:var(--ink);margin-top:20px}
.sub{color:var(--muted)}
.meta{font-size:26px;letter-spacing:.02em;color:var(--accent);margin-top:36px}
</style>
<svg class="mark" width="260" height="260" viewBox="16 16 96 96" role="img" aria-label="Obturo">
  <defs>
    <clipPath id="disc"><circle cx="64" cy="64" r="48"/></clipPath>
  </defs>
  <circle cx="64" cy="64" r="48" fill="#2563eb"/>
  <g clip-path="url(#disc)" stroke="#bfdbfe" stroke-width="4.48" stroke-linecap="round" fill="none">
    <line x1="64" y1="42.4" x2="147.14" y2="90.4"/>
    <line x1="82.71" y1="53.2" x2="82.71" y2="149.2"/>
    <line x1="82.71" y1="74.8" x2="-0.43" y2="122.8"/>
    <line x1="64" y1="85.6" x2="-19.14" y2="37.6"/>
    <line x1="45.29" y1="74.8" x2="45.29" y2="-21.2"/>
    <line x1="45.29" y1="53.2" x2="128.43" y2="5.2"/>
  </g>
  <polygon points="64,42.4 82.71,53.2 82.71,74.8 64,85.6 45.29,74.8 45.29,53.2" fill="#ffffff"/>
</svg>
<div>
  <h1>Obturo</h1>
  <p class="lead">Capture, annotate and keep your screenshots.</p>
  <p class="sub">100% local, no account.</p>
  <p class="meta">Chrome &middot; Manifest V3</p>
</div>

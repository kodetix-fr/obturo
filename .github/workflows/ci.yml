name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read only, no secret: CI checks and builds a zip, it publishes nothing.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions pinned to a commit; the comment carries the tag Dependabot tracks.
jobs:
  check:
    name: Lint, types, unit tests, package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install (no install scripts)
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Package
        run: npm run package

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: obturo-zip
          path: dist/*.zip
          if-no-files-found: error

  # End-to-end tests: the real extension in the Chromium of Playwright (headless), throwaway profile.
  # A separate job: slower than `check`, and it downloads a browser. The benchmark (npm run bench) does not run
  # here, its durations depend on the hardware.
  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install (no install scripts)
        run: npm ci --ignore-scripts

      # playwright-core is pinned by package-lock.json: same Playwright, so same Chromium as locally.
      - name: Install Chromium and its system dependencies
        run: npx playwright-core install --with-deps --no-shell chromium

      - name: End-to-end tests
        run: npm run test:e2e

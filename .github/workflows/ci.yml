name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read only, no secret: CI checks and builds a zip, it publishes nothing.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions pinned to a commit; the comment carries the tag Dependabot tracks.
jobs:
  check:
    name: Lint, types, unit tests, package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install (no install scripts)
        run: npm ci --ignore-scripts

      - name: Lint, types, unit tests
        run: npm run check

      - name: Package
        run: npm run package

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: obturo-zip
          path: dist/*.zip
          if-no-files-found: error

  # The floor of `engines` (Node 22.13, which scripts/package.mjs needs for zlib.crc32) and Windows, where the project is developed.
  # Apart from `check`, whose name is a required status.
  compat:
    name: Check on Node ${{ matrix.node }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 22.13.0 }
          - { os: windows-latest, node: 24 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install (no install scripts)
        run: npm ci --ignore-scripts

      - name: Lint, types, unit tests
        run: npm run check

      - name: Package
        run: npm run package

  # End-to-end tests: the real extension in the Chromium of Playwright (headless), throwaway profile.
  # A separate job: slower than `check`, and it downloads a browser. The benchmark (npm run bench) does not run
  # here, its durations depend on the hardware.
  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install (no install scripts)
        run: npm ci --ignore-scripts

      # playwright-core is pinned by package-lock.json: same Playwright, so same Chromium as locally.
      - name: Install Chromium and its system dependencies
        run: npx playwright-core install --with-deps --no-shell chromium

      - name: End-to-end tests
        env:
          E2E_TRACES: ${{ runner.temp }}/e2e-traces
        run: npm run test:e2e

      # A red run is diagnosed from the traces (screenshots and actions of each launch of the browser), not by running it again.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() || cancelled()
        with:
          name: e2e-traces
          path: ${{ runner.temp }}/e2e-traces
          if-no-files-found: ignore
          retention-days: 7

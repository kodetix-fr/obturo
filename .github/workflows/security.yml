name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # Monday morning, so a new advisory on a dependency shows up without a commit

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

# Actions pinned to a commit; the comment carries the tag Dependabot tracks.
jobs:
  semgrep:
    name: Semgrep (code, secrets, workflows)
    runs-on: ubuntu-latest
    container: semgrep/semgrep
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No rule is excluded. vendor/ is left out: it is Fabric.js, third-party and minified, pinned and checked by
      # hand (vendor/README.md), and no scanner rule can be fixed there.
      - name: Scan
        run: >
          semgrep scan --config p/javascript --config p/secrets --config p/github-actions
          --exclude vendor
          --error --sarif --output semgrep.sarif
      - uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # Covers the development dependencies of package-lock.json. The extension has no runtime dependency, and
  # vendor/ (Fabric.js) is outside npm: its version is pinned and checked by hand.
  npm-audit:
    name: npm audit (advisories on the dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Audit
        run: npm audit --audit-level=high

  gitleaks:
    name: Gitleaks (secrets in history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

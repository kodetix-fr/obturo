name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # Monday morning, so a new advisory on a dependency shows up without a commit

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

# Actions pinned to a commit; the comment carries the tag Dependabot tracks. The Semgrep image is pinned by digest and bumped by hand
# (Dependabot does not read the image of a job).
jobs:
  semgrep:
    name: Semgrep (code, secrets, workflows)
    runs-on: ubuntu-latest
    container: semgrep/semgrep:1.184.0@sha256:cc1b68266f267878b39739373ea9985b9a78e5d64497dd875c8de100b22695ed
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No rule is excluded. vendor/ is left out: it is Fabric.js, third-party and minified, pinned and checked by
      # hand (vendor/README.md), and no scanner rule can be fixed there.
      - name: Scan
        run: >
          semgrep scan --config p/javascript --config p/secrets --config p/github-actions
          --exclude vendor
          --error --sarif --output semgrep.sarif
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # Covers the development dependencies of package-lock.json. The extension has no runtime dependency, and
  # vendor/ (Fabric.js) is outside npm: its version is pinned and checked by hand.
  npm-audit:
    name: npm audit (advisories on the dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Audit
        run: npm audit --audit-level=high

  gitleaks:
    name: Gitleaks (secrets in history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The official action needs a licence key for an organisation, so the release binary runs directly, pinned and
      # checked against its published SHA-256.
      - name: Install Gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan the history
        run: ./gitleaks git --redact --verbose --no-banner

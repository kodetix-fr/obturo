version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # The minimum Node is 22.13 (engines), so the types stay on the 22 line; a newer major would let code use
      # an API that the oldest supported Node does not have.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday

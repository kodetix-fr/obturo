<!doctype html>
<html lang="en" class="pending">
<head>
  <meta charset="utf-8">
  <script src="db-warm.js"></script> <!-- history: opens the database during the parse, so that it is ready when db.js asks -->
  <script src="theme-boot.js"></script> <!-- the theme of the settings on <html> before the first paint (and before the stylesheet) -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Obturo</title>
  <link rel="icon" href="icons/icon32.png">
  <link rel="stylesheet" href="library.css">
</head>
<body>
  <!-- Icons: one sprite, used as <svg class="ic"><use href="#i-name"/></svg>. 24 px grid, 1.75 stroke (library.css). -->
  <svg class="sprite" aria-hidden="true" focusable="false">
    <symbol id="i-logo" viewBox="16 16 96 96">
      <clipPath id="logo-disc"><circle cx="64" cy="64" r="48"/></clipPath>
      <circle cx="64" cy="64" r="48" fill="#2563eb"/>
      <g clip-path="url(#logo-disc)" stroke="#bfdbfe" stroke-width="4.48" stroke-linecap="round" fill="none">
        <line x1="64" y1="42.4" x2="147.14" y2="90.4"/>
        <line x1="82.71" y1="53.2" x2="82.71" y2="149.2"/>
        <line x1="82.71" y1="74.8" x2="-0.43" y2="122.8"/>
        <line x1="64" y1="85.6" x2="-19.14" y2="37.6"/>
        <line x1="45.29" y1="74.8" x2="45.29" y2="-21.2"/>
        <line x1="45.29" y1="53.2" x2="128.43" y2="5.2"/>
      </g>
      <polygon points="64,42.4 82.71,53.2 82.71,74.8 64,85.6 45.29,74.8 45.29,53.2" fill="#ffffff"/>
    </symbol>
    <symbol id="i-select" viewBox="0 0 24 24"><path d="M5 3.5l14 8-6.2 1.6L10 19.5z"/></symbol>
    <symbol id="i-rect" viewBox="0 0 24 24"><rect x="4" y="5.5" width="16" height="13" rx="2.5"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M6 18L18 6M9.5 6H18v8.5"/></symbol>
    <symbol id="i-text" viewBox="0 0 24 24"><path d="M5.5 7V5.5h13V7M12 5.5v13M9 18.5h6"/></symbol>
    <symbol id="i-pen" viewBox="0 0 24 24"><path d="M5 19l1.2-4.3L16 4.9a1.9 1.9 0 0 1 2.7 0l.4.4a1.9 1.9 0 0 1 0 2.7L9.3 17.8z"/><path d="M5 19l4.3-1.2M14.4 6.5l3.1 3.1"/></symbol>
    <symbol id="i-emoji" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.2"/><path d="M8.7 14.2c.9 1.3 2 1.9 3.3 1.9s2.4-.6 3.3-1.9M9.2 9.8v.1M14.8 9.8v.1"/></symbol>
    <symbol id="i-rotate" viewBox="0 0 24 24"><path d="M20.5 12a8.5 8.5 0 1 1-2.5-6l2.5 2.5"/><path d="M20.5 3.5v5h-5"/></symbol>
    <symbol id="i-stamp" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2.5"/><path d="M3.5 14.5h17M7 17h5.5"/></symbol>
    <symbol id="i-head-end" viewBox="0 0 24 24"><path d="M5 12h14M14 7l5 5-5 5"/></symbol>
    <symbol id="i-head-none" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-head-both" viewBox="0 0 24 24"><path d="M5 12h14M10 7l-5 5 5 5M14 7l5 5-5 5"/></symbol>
    <symbol id="i-highlight" viewBox="0 0 24 24"><path d="M14.6 4.6l4.8 4.8-8.2 8.2-4.2.7.7-4.2z"/><path d="M13 6.2l4.8 4.8M4 21h8"/></symbol>
    <symbol id="i-spot" viewBox="0 0 24 24"><path fill="currentColor" stroke="none" fill-rule="evenodd" opacity=".35" d="M3.5 5.5h17v13h-17zM8 9.5v5h8v-5z"/><rect x="8" y="9.5" width="8" height="5" rx="1.2"/></symbol>
    <symbol id="i-marker" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.2"/><path d="M10.3 10.4L12.5 8.8v6.6"/></symbol>
    <symbol id="i-pixel" viewBox="0 0 24 24">
      <g fill="currentColor" stroke="none">
        <rect x="4" y="4" width="5.3" height="5.3" rx=".8"/><rect x="14.7" y="4" width="5.3" height="5.3" rx=".8"/>
        <rect x="9.35" y="9.35" width="5.3" height="5.3" rx=".8"/>
        <rect x="4" y="14.7" width="5.3" height="5.3" rx=".8"/><rect x="14.7" y="14.7" width="5.3" height="5.3" rx=".8"/>
      </g>
      <g fill="currentColor" stroke="none" opacity=".3">
        <rect x="9.35" y="4" width="5.3" height="5.3" rx=".8"/><rect x="4" y="9.35" width="5.3" height="5.3" rx=".8"/>
        <rect x="14.7" y="9.35" width="5.3" height="5.3" rx=".8"/><rect x="9.35" y="14.7" width="5.3" height="5.3" rx=".8"/>
      </g>
    </symbol>
    <!-- solid fill: the frame, and inside it a patch of the current fill color (--fill, set on the tool by panel.js) -->
    <symbol id="i-flat" viewBox="0 0 24 24"><rect x="3.8" y="5" width="16.4" height="14" rx="2.8"/><rect class="ic-fill" x="7.2" y="8.4" width="9.6" height="7.2" rx="1.2"/></symbol>
    <!-- blur: a soft blob, solid at the heart and fading out in steps -->
    <symbol id="i-blur" viewBox="0 0 24 24">
      <g fill="currentColor" stroke="none"><circle cx="12" cy="12" r="9" opacity=".2"/><circle cx="12" cy="12" r="6.3" opacity=".4"/><circle cx="12" cy="12" r="3.6"/></g>
    </symbol>
    <symbol id="i-crop" viewBox="0 0 24 24"><path d="M6.5 3v12a2.5 2.5 0 0 0 2.5 2.5h12M3 6.5h12A2.5 2.5 0 0 1 17.5 9v12"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></symbol>
    <symbol id="i-redo" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 7h15M9.5 7V4.5h5V7M6.5 7l.8 12.5h9.4L17.5 7M10 11v5M14 11v5"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="11" height="11" rx="2"/><path d="M15.5 8.5V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7.5a2 2 0 0 0 2 2h2.5"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 19.5h14"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M6.5 9.5l5.5 5.5 5.5-5.5"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h8M18 7h2M4 17h2M12 17h8"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17.2v.1"/></symbol>
    <symbol id="i-fit" viewBox="0 0 24 24"><path d="M4 9V5h4M20 9V5h-4M4 15v4h4M20 15v4h-4"/></symbol>
    <symbol id="i-frame" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="3.5"/><path d="M3.5 9.5h17"/></symbol>
    <symbol id="i-shape-rect" viewBox="0 0 24 24"><rect x="4.5" y="6.5" width="15" height="11" rx=".5"/></symbol>
    <symbol id="i-shape-round" viewBox="0 0 24 24"><rect x="4.5" y="6.5" width="15" height="11" rx="4"/></symbol>
    <symbol id="i-shape-ellipse" viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="8" ry="5.5"/></symbol>
    <symbol id="i-shape-free" viewBox="0 0 24 24"><path d="M4.5 15.5c1.5-6 3.5-9 5.5-6.5s2.5 7 5 3.5 3-6.5 4.5-4.5"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M15.2 4.8l4 4L9 19l-4.8 1 1-4.8z"/><path d="M13.4 6.6l4 4"/></symbol>
    <symbol id="i-side-left" viewBox="0 0 24 24"><circle cx="17" cy="12" r="3.6"/><path d="M4 12h7"/></symbol>
    <symbol id="i-side-right" viewBox="0 0 24 24"><circle cx="7" cy="12" r="3.6"/><path d="M13 12h7"/></symbol>
    <symbol id="i-stroke1" viewBox="0 0 24 24"><path d="M4 12h16" stroke-width="1"/></symbol>
    <symbol id="i-stroke2" viewBox="0 0 24 24"><path d="M4 12h16" stroke-width="2.5"/></symbol>
    <symbol id="i-stroke3" viewBox="0 0 24 24"><path d="M4 12h16" stroke-width="4.5"/></symbol>
    <!-- history -->
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M9 4.5h6M10.2 4.5l-.4 5.2L7 12.4V14h10v-1.6l-2.8-2.7-.4-5.2M12 14v6"/></symbol>
    <symbol id="i-history" viewBox="0 0 24 24"><path d="M4.2 12a7.8 7.8 0 1 0 2.4-5.6M4.2 4.6v3.9h3.9M12 8v4.4l3 1.8"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="5.8"/><path d="M15 15l5 5"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.6"/></symbol>
    <symbol id="i-photo" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2.5"/><circle cx="9" cy="10" r="1.6"/><path d="M4 17l5-4.5 3 2.5 3-3 5 4.5"/></symbol>
    <!-- import -->
    <symbol id="i-import" viewBox="0 0 24 24"><rect x="3.2" y="7.2" width="13.6" height="12.4" rx="2.3"/><circle cx="8" cy="11.8" r="1.4"/><path d="M4 18l4-3.6 2.8 2.2 2.6-2.4 3 2.6"/><path d="M19.6 2.4v6M16.6 5.4h6"/></symbol>
    <symbol id="i-pinoff" viewBox="0 0 24 24"><path d="M9 4.5h6M10.2 4.5l-.4 5.2L7 12.4V14h10v-1.6l-2.8-2.7-.4-5.2M12 14v6M4 4l16 16"/></symbol>
  </svg>

  <!-- history and import: same place, left of the settings button (.apptools). The import button picks files; an image can also be
       pasted (Ctrl+V) or dropped on the page. import.js is loaded on first use. Outside the fieldset: it works with no capture open. -->
  <div class="apptools">
    <button type="button" id="importBtn" class="btn icon ghost" data-i18n-aria="import.btn" data-i18n-title="import.tip"><svg class="ic" aria-hidden="true"><use href="#i-import"/></svg></button>
    <button type="button" id="historyBtn" class="btn ghost" data-i18n-title="hist.open.tip"><svg class="ic" aria-hidden="true"><use href="#i-history"/></svg><span class="lbl" data-i18n="hist.open"></span></button>
  </div>
  <!-- Opens the settings dialog. Outside the fieldset on purpose: it works with no capture open. Laid over the right
       end of the app bar by the grid. -->
  <button type="button" id="settingsBtn" class="btn icon ghost" data-i18n-label="app.settings"><svg class="ic" aria-hidden="true"><use href="#i-sliders"/></svg><span class="dot" id="settingsDot" aria-hidden="true" hidden></span></button>
  <span id="settingsNew" class="vh" data-i18n="about.new" hidden></span>
  <input type="file" id="importInput" accept="image/*" multiple hidden>
  <div id="dropHint" role="presentation" hidden><p data-i18n="import.drop"></p></div>

  <!-- The whole editor chrome is disabled until a capture is open (display: contents: the children are grid items). -->
  <fieldset id="ui" disabled>
    <header class="appbar">
      <div class="brand"><svg class="logo" aria-hidden="true"><use href="#i-logo"/></svg><h1>Obturo</h1><button type="button" id="noTraceBadge" class="notrace" hidden data-i18n="popup.noTrace" data-i18n-title="lib.noTrace.tip"></button></div>

      <div class="versions" role="group" data-i18n-aria="ver.group">
        <span id="versions" class="pills"></span>
        <button type="button" id="newVersion" class="btn icon ghost" data-i18n-aria="ver.new" data-i18n-title="ver.new.tip"><svg class="ic" aria-hidden="true"><use href="#i-plus"/></svg></button>
        <button type="button" id="delVersion" class="btn icon ghost" data-i18n-aria="ver.delete" data-i18n-title="ver.delete.tip"><svg class="ic" aria-hidden="true"><use href="#i-minus"/></svg></button>
      </div>

      <span class="sep"></span>

      <div class="actions" role="group" data-i18n-aria="app.actions">
        <!-- history: pins the open capture (never removed automatically) -->
        <button type="button" id="pin" class="btn icon ghost" aria-pressed="false" data-i18n-aria="hist.pin.editor" data-i18n-title="hist.pin.tip"><svg class="ic" aria-hidden="true"><use href="#i-pin"/></svg></button>
        <span class="vsep"></span>
        <button type="button" id="undo" class="btn icon ghost" data-i18n-aria="act.undo" data-i18n-title="act.undo.tip"><svg class="ic" aria-hidden="true"><use href="#i-undo"/></svg></button>
        <button type="button" id="redo" class="btn icon ghost" data-i18n-aria="act.redo" data-i18n-title="act.redo.tip"><svg class="ic" aria-hidden="true"><use href="#i-redo"/></svg></button>
        <button type="button" id="del" class="btn icon ghost" data-i18n-aria="act.delete" data-i18n-title="act.delete.tip"><svg class="ic" aria-hidden="true"><use href="#i-trash"/></svg></button>
        <span class="vsep"></span>
        <button type="button" id="copy" class="btn" data-i18n-title="act.copy.tip"><svg class="ic" aria-hidden="true"><use href="#i-copy"/></svg><span id="copyLabel" class="lbl" aria-live="polite" data-i18n="act.copy"></span></button>
        <!-- export: the Download button (the format chosen is written beside its label) and the caret that opens the format menu,
             which export-ui.js builds inside #split on first use. -->
        <div id="split" class="split" role="group" data-i18n-aria="dl.group">
          <button type="button" id="download" class="btn primary" data-i18n-title="act.download.tip"><svg class="ic" aria-hidden="true"><use href="#i-download"/></svg><span class="lbl" data-i18n="act.download"></span><span id="downloadFmt" class="fmt"></span></button>
          <button type="button" id="downloadMenu" class="btn primary icon" aria-haspopup="dialog" aria-expanded="false" data-i18n-label="dl.options"><svg class="ic" aria-hidden="true"><use href="#i-chevron"/></svg></button>
          <span id="dlStatus" class="vh" role="status"></span>
        </div>
      </div>
    </header>

    <aside class="rail">
      <!-- The tools, in groups by what they are for: choose, annotate (point at something, say something), put in evidence, hide. Crop is apart. -->
      <div id="tools" class="tools" role="group" data-i18n-aria="tool.group">
        <button type="button" class="tool" data-tool="select" aria-pressed="true" data-i18n-title="tool.select.tip"><svg class="ic" aria-hidden="true"><use href="#i-select"/></svg><span class="lbl" data-i18n="tool.select"></span></button>
        <span class="rail-sep"></span>
        <button type="button" class="tool" data-tool="arrow" aria-pressed="false" data-i18n-title="tool.arrow.tip"><svg class="ic" aria-hidden="true"><use href="#i-arrow"/></svg><span class="lbl" data-i18n="tool.arrow"></span></button>
        <button type="button" class="tool" data-tool="rect" aria-pressed="false" data-i18n-title="tool.rect.tip"><svg class="ic" aria-hidden="true"><use href="#i-rect"/></svg><span class="lbl" data-i18n="tool.rect"></span></button>
        <button type="button" class="tool" data-tool="pen" aria-pressed="false" data-i18n-title="tool.pen.tip"><svg class="ic" aria-hidden="true"><use href="#i-pen"/></svg><span class="lbl" data-i18n="tool.pen"></span></button>
        <button type="button" class="tool" data-tool="marker" aria-pressed="false" data-i18n-title="tool.marker.tip"><svg class="ic" aria-hidden="true"><use href="#i-marker"/></svg><span class="lbl" data-i18n="tool.marker"></span></button>
        <button type="button" class="tool" data-tool="text" aria-pressed="false" data-i18n-title="tool.text.tip"><svg class="ic" aria-hidden="true"><use href="#i-text"/></svg><span class="lbl" data-i18n="tool.text"></span></button>
        <button type="button" class="tool" data-tool="emoji" aria-pressed="false" data-i18n-title="tool.emoji.tip"><svg class="ic" aria-hidden="true"><use href="#i-emoji"/></svg><span class="lbl" data-i18n="tool.emoji"></span></button>
        <span class="rail-sep"></span>
        <button type="button" class="tool" data-tool="highlight" aria-pressed="false" data-i18n-title="tool.highlight.tip"><svg class="ic" aria-hidden="true"><use href="#i-highlight"/></svg><span class="lbl" data-i18n="tool.highlight"></span></button>
        <button type="button" class="tool" data-tool="spot" aria-pressed="false" data-i18n-title="tool.spot.tip"><svg class="ic" aria-hidden="true"><use href="#i-spot"/></svg><span class="lbl" data-i18n="tool.spot"></span></button>
        <span class="rail-sep"></span>
        <button type="button" class="tool" data-tool="flat" aria-pressed="false" data-i18n-title="tool.flat.tip"><svg class="ic" aria-hidden="true"><use href="#i-flat"/></svg><span class="lbl" data-i18n="tool.flat"></span></button>
        <button type="button" class="tool" data-tool="pixel" aria-pressed="false" data-i18n-title="tool.pixel.tip"><svg class="ic" aria-hidden="true"><use href="#i-pixel"/></svg><span class="lbl" data-i18n="tool.pixel"></span></button>
        <button type="button" class="tool" data-tool="blur" aria-pressed="false" data-i18n-title="tool.blur.tip"><svg class="ic" aria-hidden="true"><use href="#i-blur"/></svg><span class="lbl" data-i18n="tool.blur"></span></button>
      </div>
      <span class="rail-sep"></span>
      <button type="button" id="crop" class="tool" aria-pressed="false" data-i18n-title="tool.crop.tip"><svg class="ic" aria-hidden="true"><use href="#i-crop"/></svg><span class="lbl" data-i18n="tool.crop"></span></button>
    </aside>

    <div class="props" role="group" data-i18n-aria="prop.group">
      <!-- The style bar follows the tool (or the selected object): line color and stroke, text, solid fill, pixelation, blur.
           Every color is the same control: the swatches of the palette (radios built by panel.js from PALETTE) and a free color. -->
      <div class="group" id="lineProps">
        <span class="fl" id="colorLabel" data-i18n="prop.color"></span>
        <div class="swatches" id="lineSwatches" role="radiogroup" aria-labelledby="colorLabel"></div>
        <label class="field"><input type="color" id="color" value="#e53935" data-i18n-label="prop.color.custom"></label>
        <div class="field" id="strokeField">
          <span class="fl" id="thickLabel" data-i18n="prop.stroke"></span>
          <div class="seg" id="thick" role="radiogroup" aria-labelledby="thickLabel">
            <label data-i18n-title="prop.stroke.thin"><input type="radio" name="thick" value="0.6"><span><svg class="ic" aria-hidden="true"><use href="#i-stroke1"/></svg><span class="vh" data-i18n="prop.stroke.thin"></span></span></label>
            <label data-i18n-title="prop.stroke.medium"><input type="radio" name="thick" value="1" checked><span><svg class="ic" aria-hidden="true"><use href="#i-stroke2"/></svg><span class="vh" data-i18n="prop.stroke.medium"></span></span></label>
            <label data-i18n-title="prop.stroke.thick"><input type="radio" name="thick" value="1.8"><span><svg class="ic" aria-hidden="true"><use href="#i-stroke3"/></svg><span class="vh" data-i18n="prop.stroke.thick"></span></span></label>
          </div>
        </div>
      </div>

      <!-- The ends of an arrow: an arrow, a plain line or a double arrow. -->
      <div class="group" id="endProps" hidden>
        <span class="fl" id="endsLabel" data-i18n="prop.ends"></span>
        <div class="seg" id="endsPick" role="radiogroup" aria-labelledby="endsLabel">
          <label data-i18n-title="prop.ends.end"><input type="radio" name="ends" value="end"><span><svg class="ic" aria-hidden="true"><use href="#i-head-end"/></svg><span class="vh" data-i18n="prop.ends.end"></span></span></label>
          <label data-i18n-title="prop.ends.none"><input type="radio" name="ends" value="none"><span><svg class="ic" aria-hidden="true"><use href="#i-head-none"/></svg><span class="vh" data-i18n="prop.ends.none"></span></span></label>
          <label data-i18n-title="prop.ends.both"><input type="radio" name="ends" value="both"><span><svg class="ic" aria-hidden="true"><use href="#i-head-both"/></svg><span class="vh" data-i18n="prop.ends.both"></span></span></label>
        </div>
      </div>

      <!-- The emoji of the next one placed: radios built by panel.js from EMOJIS. -->
      <div class="group" id="emojiProps" hidden>
        <span class="fl" id="emojiLabel" data-i18n="prop.emoji"></span>
        <div class="seg emojis" id="emojiPick" role="radiogroup" aria-labelledby="emojiLabel"></div>
      </div>

      <!-- A numbered marker: its text (typed on the image: a double click on it, or Enter) and the side of the disc where the text is. -->
      <div class="group" id="markerProps" hidden>
        <button type="button" id="legendEdit" class="btn sm" data-i18n-title="prop.legend.tip"><svg class="ic" aria-hidden="true"><use href="#i-edit"/></svg><span data-i18n="prop.legend.edit"></span></button>
        <span class="fl" id="sideLabel" data-i18n="prop.legend.side"></span>
        <div class="seg" id="sidePick" role="radiogroup" aria-labelledby="sideLabel">
          <label data-i18n-title="prop.legend.left"><input type="radio" name="legendSide" value="left"><span><svg class="ic" aria-hidden="true"><use href="#i-side-left"/></svg><span class="vh" data-i18n="prop.legend.left"></span></span></label>
          <label data-i18n-title="prop.legend.right"><input type="radio" name="legendSide" value="right"><span><svg class="ic" aria-hidden="true"><use href="#i-side-right"/></svg><span class="vh" data-i18n="prop.legend.right"></span></span></label>
        </div>
      </div>

      <div class="group" id="textProps" hidden>
        <label class="field"><span class="fl" data-i18n="prop.font"></span>
          <select id="font">
            <option value="Arial, Helvetica, sans-serif" data-i18n="prop.font.sans"></option>
            <option value="Georgia, 'Times New Roman', serif" data-i18n="prop.font.serif"></option>
            <option value="Consolas, 'Courier New', monospace" data-i18n="prop.font.mono"></option>
            <option value="'Segoe Print', 'Comic Sans MS', cursive" data-i18n="prop.font.hand"></option>
          </select>
        </label>
        <label class="field"><span class="fl" data-i18n="prop.size"></span><input type="number" id="size" min="8" max="400" step="1" value="32"></label>
        <span class="style-btns">
          <button type="button" id="bold" class="btn icon sm" aria-pressed="false" data-i18n-label="prop.bold"><b aria-hidden="true">B</b></button>
          <button type="button" id="italic" class="btn icon sm" aria-pressed="false" data-i18n-label="prop.italic"><i aria-hidden="true">I</i></button>
          <button type="button" id="underline" class="btn icon sm" aria-pressed="false" data-i18n-label="prop.underline"><u aria-hidden="true">U</u></button>
        </span>
        <span class="fl" id="bgLabel" data-i18n="prop.background"></span>
        <div class="swatches" id="bgSwatches" role="radiogroup" aria-labelledby="bgLabel"></div>
        <label class="field"><input type="color" id="bgColor" value="#ffeb3b" data-i18n-label="prop.color.custom"></label>
      </div>

      <!-- Highlighter: the same swatches and free color. The spotlight has nothing to set: a hint. -->
      <div class="group" id="highlightProps" hidden>
        <span class="fl" id="hlLabel" data-i18n="prop.hl"></span>
        <div class="swatches" id="hlSwatches" role="radiogroup" aria-labelledby="hlLabel"></div>
        <label class="field"><input type="color" id="hlColor" value="#ffeb3b" data-i18n-label="prop.color.custom"></label>
      </div>
      <div class="group" id="spotProps" hidden>
        <span class="hint" data-i18n="prop.spotHint"></span>
      </div>

      <!-- Solid fill: the same swatches and free color. Always opaque. -->
      <div class="group" id="flatProps" hidden>
        <span class="fl" id="fillLabel" data-i18n="prop.fill"></span>
        <div class="swatches" id="swatches" role="radiogroup" aria-labelledby="fillLabel"></div>
        <label class="field"><input type="color" id="flatColor" value="#000000" data-i18n-label="prop.color.custom"></label>
      </div>

      <div class="group" id="pixelProps" hidden>
        <label class="field"><span class="fl" data-i18n="prop.strength"></span><input type="range" id="block" min="16" max="120" step="2" value="40"></label>
        <span class="hint" data-i18n="prop.textHint"></span>
      </div>

      <div class="group" id="blurProps" hidden>
        <label class="field"><span class="fl" data-i18n="prop.strength"></span><input type="range" id="blur" min="16" max="120" step="2" value="32"></label>
        <span class="hint" data-i18n="prop.textHint"></span>
      </div>

      <!-- The shape of an area (the rectangle, the solid fill, the highlighter, the spotlight, the pixelation and the blur): the next one drawn, and
           the one that is selected. The corner radii of the object are the whole of the shape (shape-pure.js). -->
      <div class="group" id="shapeProps" hidden>
        <span class="fl" id="shapeLabel" data-i18n="prop.shape"></span>
        <div class="seg" id="shapePick" role="radiogroup" aria-labelledby="shapeLabel">
          <label data-i18n-title="prop.shape.rect"><input type="radio" name="shape" value="rect"><span><svg class="ic" aria-hidden="true"><use href="#i-shape-rect"/></svg><span class="vh" data-i18n="prop.shape.rect"></span></span></label>
          <label data-i18n-title="prop.shape.round"><input type="radio" name="shape" value="round"><span><svg class="ic" aria-hidden="true"><use href="#i-shape-round"/></svg><span class="vh" data-i18n="prop.shape.round"></span></span></label>
          <label data-i18n-title="prop.shape.ellipse"><input type="radio" name="shape" value="ellipse"><span><svg class="ic" aria-hidden="true"><use href="#i-shape-ellipse"/></svg><span class="vh" data-i18n="prop.shape.ellipse"></span></span></label>
          <label data-i18n-title="prop.shape.free"><input type="radio" name="shape" value="free"><span><svg class="ic" aria-hidden="true"><use href="#i-shape-free"/></svg><span class="vh" data-i18n="prop.shape.free"></span></span></label>
        </div>
      </div>

      <div class="group" id="cropGroup" role="group" data-i18n-aria="crop.group" hidden>
        <button type="button" id="cropOk" class="btn primary sm"><svg class="ic" aria-hidden="true"><use href="#i-check"/></svg><span data-i18n="crop.ok"></span></button>
        <button type="button" id="cropCancel" class="btn sm"><svg class="ic" aria-hidden="true"><use href="#i-x"/></svg><span data-i18n="crop.cancel"></span></button>
      </div>
    </div>

    <div class="status" role="group" data-i18n-aria="out.group">
      <label class="field"><span class="fl" data-i18n="out.scale"></span><input type="number" id="scalePct" min="1" max="1000" step="1" value="100"><span class="unit">%</span></label>
      <label class="field"><span class="fl" data-i18n="out.width"></span><input type="number" id="scaleW" min="1" max="20000" step="1" value="0"><span class="unit">px</span></label>
      <span id="out" aria-live="polite"></span>
      <span id="outNote" role="status"></span>
      <button type="button" id="cropClear" class="btn sm ghost" data-i18n-title="crop.clear.tip"><span data-i18n="crop.clear"></span></button>
      <!-- The beautify panel: beautify-ui.js builds it next to the stage on first use. -->
      <div class="imgbtns">
        <button type="button" id="beautify" class="btn sm" aria-haspopup="dialog" aria-expanded="false" data-i18n-title="be.tip"><svg class="ic" aria-hidden="true"><use href="#i-frame"/></svg><span data-i18n="be.btn"></span></button>
        <button type="button" id="stamp" class="btn sm" data-i18n-title="stamp.tip"><svg class="ic" aria-hidden="true"><use href="#i-stamp"/></svg><span data-i18n="stamp.btn"></span></button>
        <button type="button" id="rotate" class="btn sm" data-i18n-title="rotate.tip"><svg class="ic" aria-hidden="true"><use href="#i-rotate"/></svg><span data-i18n="rotate.btn"></span></button>
      </div>
      <span class="sep"></span>
      <div class="zoom">
        <span id="zoomLabel"></span>
        <div class="zbtns">
          <button type="button" id="fit" class="btn sm ghost" data-i18n-title="zoom.fit.tip"><svg class="ic" aria-hidden="true"><use href="#i-fit"/></svg><span data-i18n="zoom.fit"></span></button>
          <button type="button" id="actual" class="btn sm ghost" data-i18n-title="zoom.actual.tip" data-i18n="zoom.actual"></button>
        </div>
      </div>
    </div>
  </fieldset>

  <div id="banner" role="alert" hidden><svg class="ic" aria-hidden="true"><use href="#i-alert"/></svg><span id="bannerText"></span></div>

  <main id="stage">
    <div id="stageMsg" class="state" data-state="loading">
      <svg class="state-ic st-logo" aria-hidden="true"><use href="#i-logo"/></svg>
      <svg class="ic state-ic st-alert" aria-hidden="true"><use href="#i-alert"/></svg>
      <p id="stageTitle" class="state-title" data-i18n="state.loading"></p>
      <p id="stageHint" class="state-hint" hidden></p>
      <!-- the empty library only: the import (library.js) -->
      <button type="button" id="stageImport" class="btn state-import" hidden><svg class="ic" aria-hidden="true"><use href="#i-import"/></svg><span data-i18n="import.btn"></span></button>
    </div>
    <!-- a read-only tab only: the capture as the editor would export it, with Copy and Download (viewer.js) -->
    <figure id="viewer" class="viewer" hidden>
      <img id="viewerImg" alt="">
      <figcaption class="viewer-bar">
        <button type="button" id="viewerCopy" class="btn" data-i18n="act.copy"></button>
        <button type="button" id="viewerDownload" class="btn" data-i18n="act.download"></button>
      </figcaption>
    </figure>
  </main>

  <nav class="filmstrip" data-i18n-aria="strip.label">
    <!-- history: the shortcut to the whole history; the strip itself holds the latest captures only -->
    <button type="button" id="historyAll" class="more"><svg class="ic" aria-hidden="true"><use href="#i-grid"/></svg><span class="more-label" data-i18n="hist.all"></span><span id="historyAllCount" class="more-count"></span></button>
    <ul id="strip"></ul>
  </nav>

  <!-- Settings. Every control with a `name` equal to a key of settings.js is read and saved by settings-ui.js on its
       own ('change' event): to add a setting, add a row in a <section> (or a new <section>) and its texts in
       locales/en.ui.js and fr.ui.js. The language choices are generated from LANGUAGES (i18n.js). -->
  <dialog id="settings" aria-labelledby="settingsTitle">
    <form method="dialog" id="settingsForm">
      <header class="dlg-head">
        <h2 id="settingsTitle" data-i18n="settings.title"></h2>
        <button type="submit" class="btn icon ghost" data-i18n-label="common.close"><svg class="ic" aria-hidden="true"><use href="#i-x"/></svg></button>
      </header>
      <div id="settingsBody" class="dlg-body">
        <!-- a setting that could not be read or saved (settings-ui.js shows it, with the text of the case) -->
        <p id="settingsError" class="dlg-status error" role="alert" data-i18n="settings.saveFailed" hidden></p>
        <section data-section="appearance">
          <h3 data-i18n="settings.appearance"></h3>
          <div class="row">
            <label for="language" data-i18n="settings.language"></label>
            <select id="language" name="language">
              <option value="auto" data-i18n="settings.language.auto"></option>
            </select>
          </div>
          <div class="row">
            <span id="themeLabel" data-i18n="settings.theme"></span>
            <div class="seg" role="radiogroup" aria-labelledby="themeLabel">
              <label><input type="radio" name="theme" value="auto"><span data-i18n="settings.theme.auto"></span></label>
              <label><input type="radio" name="theme" value="light"><span data-i18n="settings.theme.light"></span></label>
              <label><input type="radio" name="theme" value="dark"><span data-i18n="settings.theme.dark"></span></label>
            </div>
          </div>
        </section>
        <!-- history: retention, size cap, storage gauge, purge. The two selects are read and saved by settings-ui.js (data-type="number"
             because their values are numbers); the gauge and the buttons are history-settings.js. -->
        <section data-section="history">
          <h3 data-i18n="hist.set.title"></h3>
          <div class="row">
            <label for="retentionDays" data-i18n="hist.set.keep"></label>
            <select id="retentionDays" name="retentionDays" data-type="number">
              <option value="7" data-i18n="hist.keep.week"></option>
              <option value="30" data-i18n="hist.keep.month"></option>
              <option value="90" data-i18n="hist.keep.quarter"></option>
              <option value="365" data-i18n="hist.keep.year"></option>
              <option value="0" data-i18n="hist.keep.forever"></option>
            </select>
          </div>
          <div class="row">
            <label for="maxBytes" data-i18n="hist.set.cap"></label>
            <select id="maxBytes" name="maxBytes" data-type="number">
              <option value="500000000" data-i18n="hist.cap.half"></option>
              <option value="1000000000" data-i18n="hist.cap.single"></option>
              <option value="2000000000" data-i18n="hist.cap.double"></option>
              <option value="5000000000" data-i18n="hist.cap.five"></option>
              <option value="10000000000" data-i18n="hist.cap.ten"></option>
              <option value="0" data-i18n="hist.cap.none"></option>
            </select>
          </div>
          <div class="row">
            <label for="noTrace" data-i18n="hist.set.noTrace"></label>
            <input type="checkbox" id="noTrace" name="noTrace">
          </div>
          <p class="note" data-i18n="hist.set.noTrace.note"></p>
          <p class="note" data-i18n="hist.set.note"></p>
          <p id="histReadonly" class="note" data-i18n="hist.set.readonly" hidden></p>
          <div class="storage">
            <div id="storageMeter" class="meter" role="meter" aria-valuemin="0" aria-valuenow="0" aria-valuemax="1" data-i18n-aria="hist.meter.label" hidden><span id="storageFill" class="meter-fill"></span></div>
            <p id="storageText" class="storage-text" role="status"></p>
            <p id="storagePending" class="storage-pending" hidden></p>
          </div>
          <div class="row actions-row">
            <button type="button" id="purgeBtn" class="btn sm"><svg class="ic" aria-hidden="true"><use href="#i-trash"/></svg><span data-i18n="hist.purge.btn"></span></button>
            <button type="button" id="wipeBtn" class="btn sm danger"><span data-i18n="hist.wipe.btn"></span></button>
          </div>
        </section>
        <!-- capture: what happens once a capture is taken. A plain select: settings-ui.js reads and saves it by name. -->
        <section data-section="capture">
          <h3 data-i18n="settings.capture"></h3>
          <div class="row">
            <label for="afterCapture" data-i18n="settings.capture.after"></label>
            <select id="afterCapture" name="afterCapture">
              <option value="ask" data-i18n="settings.capture.ask"></option>
              <option value="copy" data-i18n="settings.capture.copy"></option>
              <option value="save" data-i18n="settings.capture.save"></option>
            </select>
          </div>
          <p class="hint" data-i18n="settings.capture.hint"></p>
          <div class="row">
            <label for="captureDelay" data-i18n="settings.capture.delay"></label>
            <select id="captureDelay" name="captureDelay" data-type="number">
              <option value="0" data-i18n="settings.capture.delay.off"></option>
              <option value="3" data-i18n="settings.capture.delay.three"></option>
              <option value="5" data-i18n="settings.capture.delay.five"></option>
              <option value="10" data-i18n="settings.capture.delay.ten"></option>
            </select>
          </div>
          <p class="hint" data-i18n="settings.capture.delay.hint"></p>
          <div class="row">
            <label for="redactSensitive" data-i18n="settings.capture.redact"></label>
            <input type="checkbox" id="redactSensitive" name="redactSensitive">
          </div>
          <p class="hint" data-i18n="settings.capture.redact.hint"></p>
        </section>
        <!-- export: the Download section. The format choices are generated by settings-ui.js (DOWNLOAD_FORMATS). -->
        <section data-section="download">
          <h3 data-i18n="settings.download"></h3>
          <div class="row">
            <span id="downloadFormatLabel" data-i18n="settings.download.format"></span>
            <div class="seg" id="downloadFormatChoices" role="radiogroup" aria-labelledby="downloadFormatLabel"></div>
          </div>
          <div class="row">
            <span id="downloadQualityLabel"><span data-i18n="settings.download.quality"></span> <small class="hint" data-i18n="settings.download.quality.hint"></small></span>
            <span class="range"><input type="range" id="downloadQualityRange" name="downloadQuality" min="0.1" max="1" step="0.05" aria-labelledby="downloadQualityLabel"><output id="downloadQualityOut" for="downloadQualityRange"></output></span>
          </div>
          <div class="row">
            <span id="pdfLayoutLabel" data-i18n="settings.download.layout"></span>
            <div class="seg" role="radiogroup" aria-labelledby="pdfLayoutLabel">
              <label><input type="radio" name="pdfLayout" value="fit"><span data-i18n="dl.layout.fit"></span></label>
              <label><input type="radio" name="pdfLayout" value="a4"><span data-i18n="dl.layout.paper"></span></label>
            </div>
          </div>
          <div class="row">
            <span id="pdfEncodingLabel" data-i18n="settings.download.encoding"></span>
            <div class="seg" role="radiogroup" aria-labelledby="pdfEncodingLabel">
              <label><input type="radio" name="pdfEncoding" value="flate"><span data-i18n="dl.encoding.flate"></span></label>
              <label><input type="radio" name="pdfEncoding" value="jpeg"><span data-i18n="dl.encoding.jpeg"></span></label>
            </div>
          </div>
          <div class="row">
            <label for="filenameTemplate" data-i18n="settings.download.name"></label>
            <input type="text" id="filenameTemplate" name="filenameTemplate" class="fname" maxlength="80" autocomplete="off" spellcheck="false">
          </div>
          <p class="hint" data-i18n="settings.download.name.hint"></p>
        </section>
        <!-- full page: the wait after each scroll and the fixed elements. Plain controls: settings-ui.js reads and saves them by name
             (data-type="number" for the select). -->
        <section data-section="full">
          <h3 data-i18n="settings.full"></h3>
          <div class="row">
            <label for="fullPageWait" data-i18n="settings.full.wait"></label>
            <select id="fullPageWait" name="fullPageWait" data-type="number">
              <option value="0" data-i18n="settings.full.wait.auto"></option>
              <option value="500" data-i18n="settings.full.wait.half"></option>
              <option value="1000" data-i18n="settings.full.wait.one"></option>
              <option value="2000" data-i18n="settings.full.wait.two"></option>
            </select>
          </div>
          <p class="note" data-i18n="settings.full.wait.note"></p>
          <div class="row">
            <span id="fullPageFixedLabel" data-i18n="settings.full.fixed"></span>
            <div class="seg" role="radiogroup" aria-labelledby="fullPageFixedLabel">
              <label><input type="radio" name="fullPageFixed" value="edges"><span data-i18n="settings.full.fixed.edges"></span></label>
              <label><input type="radio" name="fullPageFixed" value="hide"><span data-i18n="settings.full.fixed.hide"></span></label>
            </div>
          </div>
          <p class="note" data-i18n="settings.full.fixed.note"></p>
        </section>

        <section data-section="about" id="aboutSection">
          <h3 data-i18n="settings.about"></h3>
          <p id="aboutVersion" class="note"></p>
          <div id="aboutNews" hidden>
            <h4 data-i18n="about.newsTitle"></h4>
            <p class="note" data-i18n="about.news"></p>
          </div>
          <p class="note" data-i18n="about.note"></p>
          <div class="about-links">
            <a id="reviewLink" class="btn" target="_blank" rel="noopener noreferrer" data-i18n="about.review"></a>
            <a id="issuesLink" class="btn" target="_blank" rel="noopener noreferrer" data-i18n="about.problem"></a>
          </div>
          <p class="note"><span data-i18n="about.publisher"></span> <a id="obliteroLink" target="_blank" rel="noopener noreferrer"></a> <span data-i18n="about.oblitero"></span></p>
          <p class="note" data-i18n="settings.support.note"></p>
          <a id="supportLink" class="btn" href="https://kodetix.fr/soutenir" target="_blank" rel="noopener noreferrer" data-i18n="settings.support"></a>
        </section>
      </div>
    </form>
  </dialog>

  <!-- history: the whole history, a large modal sheet. history-view.js fills it (cards are built with createElement, the
       titles and addresses of the captured pages only ever go through textContent). -->
  <dialog id="history" class="sheet" aria-labelledby="historyTitle">
    <header class="hv-head">
      <h2 id="historyTitle" data-i18n="hist.title"></h2>
      <p id="hvCount" class="hv-count" role="status"></p>
      <label class="hv-search">
        <svg class="ic" aria-hidden="true"><use href="#i-search"/></svg>
        <input id="hvQuery" type="search" autocomplete="off" spellcheck="false" data-i18n-aria="hist.search.label">
      </label>
      <button type="button" id="hvClose" class="btn icon ghost" data-i18n-label="hist.close"><svg class="ic" aria-hidden="true"><use href="#i-x"/></svg></button>
    </header>

    <div class="hv-tools">
      <div id="hvFilters" class="hv-filters">
        <label class="field"><span class="fl" data-i18n="hist.host.label"></span>
          <select id="hvHost"><option value="" data-i18n="hist.host.all"></option></select>
        </label>
        <div id="hvPeriod" class="seg" role="radiogroup" data-i18n-aria="hist.period.label">
          <label><input type="radio" name="hvPeriod" value="all" checked><span data-i18n="hist.period.all"></span></label>
          <label><input type="radio" name="hvPeriod" value="today"><span data-i18n="hist.period.today"></span></label>
          <label><input type="radio" name="hvPeriod" value="week"><span data-i18n="hist.period.week"></span></label>
          <label><input type="radio" name="hvPeriod" value="month"><span data-i18n="hist.period.month"></span></label>
        </div>
        <button type="button" id="hvPinned" class="btn sm" aria-pressed="false" data-i18n-title="hist.pin.tip"><svg class="ic" aria-hidden="true"><use href="#i-pin"/></svg><span data-i18n="hist.pinned.only"></span></button>
      </div>
      <!-- Replaces the filters while something is selected. #bulkExtra is empty on purpose: the export fills it. -->
      <div id="hvBulk" class="hv-bulk" role="toolbar" data-i18n-aria="hist.bulk.label" hidden>
        <button type="button" id="hvClear" class="btn icon ghost sm" data-i18n-label="hist.sel.clear"><svg class="ic" aria-hidden="true"><use href="#i-x"/></svg></button>
        <strong id="hvSelCount" role="status"></strong>
        <button type="button" id="hvSelectAll" class="btn sm ghost"></button>
        <span class="sep"></span>
        <button type="button" id="hvPin" class="btn sm"><svg class="ic" aria-hidden="true"><use href="#i-pin"/></svg><span data-i18n="hist.bulk.pin"></span></button>
        <button type="button" id="hvUnpin" class="btn sm"><svg class="ic" aria-hidden="true"><use href="#i-pinoff"/></svg><span data-i18n="hist.bulk.unpin"></span></button>
        <div id="bulkExtra" class="bulk-extra"><button type="button" id="bulkExport" class="btn sm" data-i18n-title="export.bulk.tip"><svg class="ic" aria-hidden="true"><use href="#i-download"/></svg><span data-i18n="export.bulk"></span></button></div> <!-- export -->
        <button type="button" id="hvDelete" class="btn sm danger"><svg class="ic" aria-hidden="true"><use href="#i-trash"/></svg><span data-i18n="hist.bulk.delete"></span></button>
      </div>
    </div>

    <div class="hv-body">
      <div id="hvScroll" class="hv-scroll">
        <ul id="hvGrid" class="hv-grid" role="list" data-i18n-aria="hist.grid"></ul>
        <div id="hvSentinel" class="hv-sentinel" aria-hidden="true"></div>
        <p id="hvMore" class="hv-more" hidden data-i18n="hist.more"></p>
      </div>
      <div id="hvState" class="state hv-state" data-state="loading" hidden>
        <svg class="state-ic st-logo" aria-hidden="true"><use href="#i-logo"/></svg>
        <svg class="ic state-ic st-alert" aria-hidden="true"><use href="#i-alert"/></svg>
        <p id="hvStateTitle" class="state-title"></p>
        <p id="hvStateHint" class="state-hint" hidden></p>
        <button type="button" id="hvStateAction" class="btn sm" hidden></button>
      </div>
    </div>

    <footer class="hv-foot">
      <p class="hv-hint" data-i18n="hist.hint.keys"></p>
      <p id="hvStatus" class="hv-status" role="status"></p>
      <button type="button" id="hvPurge" class="btn sm ghost" data-i18n="hist.purge.btn"></button>
      <button type="button" id="hvStorage" class="btn sm ghost" data-i18n-title="hist.footer.settings"><svg class="ic" aria-hidden="true"><use href="#i-sliders"/></svg><span id="hvStorageText"></span></button>
    </footer>
  </dialog>

  <!-- history: a confirmation (bulk delete, delete everything). history-dialogs.js fills the texts; with a word to type, the
       confirm button stays off until it is typed; while it works, a progress bar and no way out. -->
  <dialog id="confirmDlg" class="small" aria-labelledby="cfTitle" aria-describedby="cfBody">
    <div class="dlg-form">
      <h2 id="cfTitle" class="dlg-title"></h2>
      <div id="cfBody" class="dlg-text"></div>
      <label id="cfTypeRow" class="dlg-type" hidden><span id="cfTypeLabel"></span><input id="cfType" type="text" autocomplete="off" spellcheck="false"></label>
      <progress id="cfProgress" class="dlg-progress" max="1" hidden></progress>
      <p id="cfStatus" class="dlg-status" role="status"></p>
      <div class="dlg-actions">
        <button type="button" id="cfCancel" class="btn"></button>
        <button type="button" id="cfOk" class="btn danger solid"></button>
      </div>
    </div>
  </dialog>

  <!-- history: "Purge now" of the settings, with a preview of what the options would remove. -->
  <dialog id="purgeDlg" class="small" aria-labelledby="pgTitle">
    <div class="dlg-form">
      <h2 id="pgTitle" class="dlg-title" data-i18n="hist.purge.title"></h2>
      <div class="pg-row">
        <label class="pg-check"><input type="checkbox" id="pgAgeOn" checked><span id="pgAgeLabel" data-i18n="hist.purge.age"></span></label>
        <input type="number" id="pgDays" min="1" max="3650" step="1" value="30" aria-labelledby="pgAgeLabel">
        <span class="unit" data-i18n="hist.purge.days"></span>
      </div>
      <div class="pg-row">
        <label class="pg-check"><input type="checkbox" id="pgCapOn"><span id="pgCapLabel" data-i18n="hist.purge.cap"></span></label>
        <input type="number" id="pgSize" min="0" step="any" value="1" aria-labelledby="pgCapLabel">
        <select id="pgUnit" data-i18n-aria="hist.set.cap">
          <option value="MB" data-i18n="hist.unit.mb"></option>
          <option value="GB" data-i18n="hist.unit.gb" selected></option>
        </select>
      </div>
      <p class="dlg-note" data-i18n="hist.purge.note"></p>
      <div id="pgPreview" class="pg-preview" role="status"></div>
      <progress id="pgProgress" class="dlg-progress" hidden></progress>
      <div class="dlg-actions">
        <button type="button" id="pgClose" class="btn" data-i18n="hist.cancel"></button>
        <button type="button" id="pgRun" class="btn danger solid" data-i18n="hist.purge.run"></button>
      </div>
    </div>
  </dialog>

  <script type="module" src="library.js"></script>
</body>
</html>
